<head>

  <link rel="apple-touch-startup-image" href="splash/1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)">

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body{overscroll-behavior:none;touch-action:manipulation}
  #stage{animation:fade .55s ease-out both}
  html.still #stage{animation:none}
  @keyframes fade{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
  html,body{height:100%;background:#eef2f3;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
  #stage{position:relative;width:100%;height:100vh;height:100dvh;overflow:hidden}
  html.still #stage{width:390px;height:844px}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  .hud{position:absolute;inset:0;pointer-events:none;color:#161c20}
  .brand{position:absolute;left:26px;top:calc(env(safe-area-inset-top,0px) + 18px);
    font-size:clamp(9px,2.6vw,11px);font-weight:600;letter-spacing:.34em;opacity:.78}
  .bat{position:absolute;right:24px;top:calc(env(safe-area-inset-top,0px) + 14px);
    display:flex;align-items:center;gap:7px}
  .bat .pct{font-size:clamp(9px,2.5vw,11px);font-variant-numeric:tabular-nums;
    letter-spacing:.04em;opacity:.8;color:#161c20}
  .cell{position:relative;width:clamp(54px,16vw,72px);height:clamp(20px,5.6vw,26px);
    border:1.6px solid rgba(22,28,32,.55);border-radius:7px;overflow:hidden;
    background:rgba(255,255,255,.18)}
  .cell::after{content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);
    width:3px;height:38%;background:rgba(22,28,32,.55);border-radius:0 2px 2px 0}
  .cell .fill{position:absolute;inset:2px auto 2px 2px;width:0%;border-radius:5px;
    background:linear-gradient(90deg,#7fb3a8,#3f8f7f);
    transition:width .9s cubic-bezier(.22,.61,.36,1)}
  .cell .fill.low{background:linear-gradient(90deg,#e0a06a,#c9713c)}
  .cell .glare{position:absolute;top:0;bottom:0;width:40%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    animation:sweep 2.6s ease-in-out infinite}
  @keyframes sweep{0%{left:-45%}55%{left:105%}100%{left:105%}}
  .bat .bolt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:clamp(11px,3.4vw,14px);color:#0d2b25;opacity:0}
  .cell.charging .bolt{opacity:1;animation:bolt 1.1s ease-in-out infinite}
  @keyframes bolt{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.95}
                  50%{transform:translate(-50%,-50%) scale(1.22);opacity:.55}}

  .agenda{position:absolute;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 178px);
    padding:12px 14px;border-radius:18px;color:#fff;
    background:rgba(14,20,24,.30);border:1px solid rgba(255,255,255,.20);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
    text-shadow:0 1px 10px rgba(8,12,15,.35);display:none}
  .agenda.show{display:block}
  .ag-h{font-size:clamp(8px,2.2vw,9.5px);letter-spacing:.22em;opacity:.62;margin-bottom:8px;
    display:flex;justify-content:space-between}
  .ag-row{display:flex;align-items:baseline;gap:9px;padding:3.5px 0;
    font-size:clamp(11px,3.2vw,13px);font-weight:400}
  .ag-t{font-variant-numeric:tabular-nums;opacity:.72;font-size:.9em;letter-spacing:.02em;
    min-width:3.2em}
  .ag-x{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ag-dot{width:9px;height:9px;border-radius:50%;border:1.4px solid rgba(255,255,255,.75);
    flex:0 0 auto;transform:translateY(-1px)}
  .ag-sep{height:1px;background:rgba(255,255,255,.22);margin:8px 0 6px}
  .ag-more{font-size:clamp(9px,2.4vw,10px);opacity:.55;margin-top:4px;letter-spacing:.04em}
  .gear{position:absolute;right:24px;top:calc(env(safe-area-inset-top,0px) + 44px);
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#161c20;opacity:.35;background:rgba(255,255,255,.28);
    border:.5px solid rgba(22,28,32,.18);pointer-events:auto}
  .city{position:absolute;left:26px;top:calc(env(safe-area-inset-top,0px) + 34px);
    font-size:clamp(9px,2.5vw,11px);letter-spacing:.06em;opacity:.55;color:#161c20}
  .clock{position:absolute;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
    color:#fff;font-size:clamp(46px,16.5vw,78px);font-weight:200;line-height:.92;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;text-shadow:0 2px 18px rgba(10,14,17,.28)}
  .clock small{font-size:15px;font-weight:300;opacity:.6;margin-left:7px;letter-spacing:.04em}
  .date{position:absolute;left:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);
    color:#fff;font-size:clamp(8.5px,2.4vw,10px);font-weight:500;letter-spacing:.22em;opacity:.72}
  .right{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);
    text-align:right;color:#fff}
  .greet{font-size:clamp(14px,4.4vw,19px);font-weight:200;line-height:1.24;text-shadow:0 1px 12px rgba(10,14,17,.25)}
  .wx{margin-top:7px;font-size:clamp(9px,2.6vw,11px);font-weight:400;letter-spacing:.04em;opacity:.72;
    font-variant-numeric:tabular-nums}
  .nowp{position:absolute;left:26px;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    color:#fff;font-size:clamp(9px,2.5vw,10.5px);letter-spacing:.03em;opacity:.62;display:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowp.show{display:block}
  .nowp .eq{display:inline-block;margin-right:6px;letter-spacing:1px}
  .nowp .eq span{display:inline-block;width:2px;background:rgba(255,255,255,.85);
    border-radius:1px;animation:eq .9s ease-in-out infinite}
  .nowp .eq span:nth-child(1){height:6px;animation-delay:0s}
  .nowp .eq span:nth-child(2){height:10px;animation-delay:.15s}
  .nowp .eq span:nth-child(3){height:7px;animation-delay:.3s}
  .nowp.paused .eq span{animation-play-state:paused;opacity:.45}
  @keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.25)}}

  /* ===== 排版編輯 ===== */
  .editing .brand,.editing .city,.editing .bat,.editing .clock,.editing .date,
  .editing .right,.editing .agenda,.editing .nowp{
    outline:1px dashed rgba(255,255,255,.55);outline-offset:6px;border-radius:6px;
    touch-action:none;cursor:grab}
  .editing .agenda{outline-color:rgba(255,255,255,.45)}
  .edit-hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);
    transform:translateX(-50%);padding:5px 12px;border-radius:999px;
    background:rgba(14,20,24,.45);color:#fff;font-size:11px;letter-spacing:.08em;
    opacity:0;transition:opacity .35s;pointer-events:none}
  .edit-hint.show{opacity:.9}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;
    background:rgba(16,22,26,.82);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    color:#fff;border-radius:22px 22px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(105%);transition:transform .38s cubic-bezier(.22,.61,.36,1);
    max-height:78%;overflow:auto;pointer-events:auto}
  .sheet.open{transform:none}
  html.still .sheet{transition:none}
  .sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sh-t{font-size:13px;letter-spacing:.12em;opacity:.8}
  .sh-done{font-size:13px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22)}
  .sh-sec{font-size:10px;letter-spacing:.2em;opacity:.45;margin:14px 0 6px}
  .sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sh-btn{font-size:12.5px;padding:10px 12px;border-radius:12px;text-align:center;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);opacity:.55}
  .sh-btn.on{opacity:1;background:rgba(127,179,168,.28);border-color:rgba(127,179,168,.65)}
  .sh-row{display:flex;gap:8px;margin-top:8px}
  .sh-row .sh-btn{flex:1}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="grain"></div>
  <div class="hud">
    <div class="brand">WELCOME</div>
    <div class="gear" id="gear">✳︎</div>
    <div class="city" id="city"></div>
    <div class="bat">
      <div class="pct" id="pct">69%</div>
      <div class="cell" id="cell">
        <div class="fill" id="fill"></div>
        <div class="glare"></div>
        <div class="bolt">⚡</div>
      </div>
    </div>
    <div class="agenda" id="agenda">
      <div class="ag-h"><span>今天</span><span id="ag-count"></span></div>
      <div id="ag-events"></div>
      <div class="ag-sep" id="ag-sep"></div>
      <div id="ag-todos"></div>
    </div>
    <div class="clock" id="clock">10:24<small id="sec">36</small></div>
    <div class="date" id="date">SUN · 6 NOV</div>
    <div class="right">
      <div class="greet" id="greet">Good<br>Afternoon</div>
      <div class="wx" id="wx">18°&nbsp;&nbsp;Light rain</div>
    </div>
    <div class="nowp" id="nowp"></div>
  </div>

  <div class="edit-hint" id="hint">長按畫面可編輯排版</div>
  <div class="sheet" id="sheet">
    <div class="sh-h"><span class="sh-t">排版</span><span class="sh-done" id="done">完成</span></div>
    <div class="sh-sec">尺寸</div>
    <div class="sh-row">
      <div class="sh-btn" data-fam="S">小</div>
      <div class="sh-btn" data-fam="M">中</div>
      <div class="sh-btn" data-fam="L">大</div>
    </div>
    <div class="sh-sec">顯示元件</div>
    <div class="sh-grid" id="toggles"></div>
    <div class="sh-sec">時鐘</div>
    <div class="sh-row">
      <div class="sh-btn" data-clock="left">靠左</div>
      <div class="sh-btn" data-clock="right">靠右</div>
    </div>
    <div class="sh-row">
      <div class="sh-btn" data-size="0.82">小</div>
      <div class="sh-btn" data-size="1">中</div>
      <div class="sh-btn" data-size="1.24">大</div>
    </div>
    <div class="sh-sec">拖曳元件可自由移動位置</div>
    <div class="sh-row"><div class="sh-btn" id="reset">恢復預設</div></div>
  </div>

  </div>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  const FREEZE = q.has('t') ? parseFloat(q.get('t')) : null;

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  const SKY_T = [243,246,247], SKY_B = [203,214,219];
  const COLS = [[186,197,203],[150,162,170],[98,110,118],[33,39,44]];

  // 固定構圖（比隨機穩定）
  const LAYERS = [
    {y:.44, amp:.10, peaks:[[.14,.30,.95],[.55,.22,.85],[.86,.17,.55]], rough:.010},
    {y:.55, amp:.13, peaks:[[.30,.17,1.0],[.68,.13,.90],[.93,.09,.50]], rough:.012},
    {y:.66, amp:.17, peaks:[[.63,.15,1.0],[.23,.20,.70]], rough:.014},
    {y:.81, amp:.14, peaks:[[.42,.26,.95],[.86,.12,.60]], rough:.012}
  ];

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  function makeNoise(seed, n){
    const r = mulberry32(seed), a = [];
    for (let i=0;i<n;i++) a.push(r()*2-1);
    const out = [], k = 7;
    for (let i=0;i<n;i++){
      let s=0,c=0;
      for (let j=-k;j<=k;j++){ s += a[Math.min(n-1,Math.max(0,i+j))]; c++; }
      out.push(s/c);
    }
    return out;
  }

  function ridgeLine(L, i, t){
    const N = 220, noise = NOISE[i], pts = [];
    const raw = new Array(N).fill(0);
    for (let k=0;k<N;k++){
      const x = k/(N-1);
      let h = 0;
      for (const [cx,s,a] of L.peaks) h += a * Math.exp(-Math.pow(Math.abs(x-cx)/s, 1.7));
      raw[k] = h;
    }
    const mx = Math.max(...raw) || 1;
    const dx = (0.0015 + 0.0028*i) * Math.sin(2*Math.PI*t + i*0.9);
    for (let k=0;k<N;k++){
      const x = k/(N-1);
      const y = H*L.y - H*L.amp*(raw[k]/mx + L.rough*noise[k]*6);
      pts.push([ (x+dx)*W, y ]);
    }
    return pts;
  }

  const NOISE = LAYERS.map((_,i)=>makeNoise(101+i*13, 220));

  function fillBelow(pts, col, alpha){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.lineTo(W*1.08, H); ctx.lineTo(-W*0.08, H); ctx.closePath();
    ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
    ctx.fill();
  }

  function sky(t){
    const g = ctx.createLinearGradient(0,0,0,H*0.9);
    g.addColorStop(0, `rgb(${SKY_T})`);
    g.addColorStop(1, `rgb(${SKY_B})`);
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // 太陽光暈
    const cx = W*0.30, cy = H*0.16, r = Math.min(W,H)*0.30;
    const pulse = 0.80 + 0.35*Math.sin(2*Math.PI*t);
    const rg = ctx.createRadialGradient(cx,cy,0,cx,cy,r*2.4);
    rg.addColorStop(0, `rgba(255,252,240,${0.55*pulse})`);
    rg.addColorStop(0.35, `rgba(255,251,238,${0.22*pulse})`);
    rg.addColorStop(1, 'rgba(255,250,240,0)');
    ctx.fillStyle = rg; ctx.fillRect(0,0,W,H);
    ctx.beginPath(); ctx.arc(cx,cy,r*0.52,0,7);
    ctx.strokeStyle = `rgba(255,253,246,${0.55*pulse})`; ctx.lineWidth = Math.max(1.5, W*0.0045); ctx.stroke();
  }

  function fogBand(t, i){
    const base = H*(LAYERS[i+1].y - 0.02) + H*0.018*Math.sin(2*Math.PI*t + i*1.7);
    const g = ctx.createLinearGradient(0, base - H*0.10, 0, base + H*0.10);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.62)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, base - H*0.10, W, H*0.20);
  }

  // ---- 風力發電機 ----
  function yOnLayer(i, xN, t){
    const L = LAYERS[i], N = 220;
    const raw = new Array(N).fill(0);
    for (let k=0;k<N;k++){
      const x = k/(N-1); let h = 0;
      for (const [cx,s,a] of L.peaks) h += a*Math.exp(-Math.pow(Math.abs(x-cx)/s,1.7));
      raw[k] = h;
    }
    const mx = Math.max(...raw)||1;
    const k = Math.max(0, Math.min(N-1, Math.round(xN*(N-1))));
    return H*L.y - H*L.amp*(raw[k]/mx + L.rough*NOISE[i][k]*6);
  }

  function turbine(t){
    const xN = 0.165, i = 2;
    const y0 = yOnLayer(i, xN, t);
    const x = xN*W;
    const towerH = H*0.235, tw0 = W*0.012, tw1 = W*0.008;
    ctx.save();
    ctx.strokeStyle = 'rgba(24,30,35,.92)'; ctx.fillStyle = 'rgba(24,30,35,.92)';
    // 塔身
    ctx.beginPath();
    ctx.moveTo(x-tw0, y0); ctx.lineTo(x+tw0, y0);
    ctx.lineTo(x+tw1, y0-towerH); ctx.lineTo(x-tw1, y0-towerH); ctx.closePath();
    ctx.fill();
    // 機艙
    const ny = y0 - towerH;
    ctx.beginPath(); ctx.ellipse(x+W*0.004, ny, W*0.022, W*0.011, 0, 0, 7); ctx.fill();
    // 葉片
    const wind = 0.55 + 0.45*Math.sin(2*Math.PI*t*1.0);
    const ang = 2*Math.PI*(t*2.4 + 0.1);
    const R = Math.min(W,H)*0.135;
    ctx.translate(x+W*0.004, ny);
    for (let b=0;b<3;b++){
      ctx.save(); ctx.rotate(ang + b*2*Math.PI/3);
      ctx.beginPath();
      ctx.moveTo(0,-W*0.005);
      ctx.quadraticCurveTo(R*0.42, -R*0.13, R, -W*0.004);
      ctx.quadraticCurveTo(R*0.45, R*0.02, 0, W*0.005);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,W*0.010,0,7); ctx.fill();
    ctx.restore();
    return {wind: 4 + 6*wind, rpm: 8 + 14*wind};
  }

  function draw(t){
    sky(t);
    let tw = null;
    for (let i=0;i<LAYERS.length;i++){
      const pts = ridgeLine(LAYERS[i], i, t);
      fillBelow(pts, COLS[i], 1);
      if (i === 1) tw = turbine(t);   // 風車站在第二層稜線上
      if (i < LAYERS.length-1) fogBand(t, i);
    }
    return tw;
  }

  const stage = document.getElementById('stage');
  const STILL = q.has('still');
  if (STILL) document.documentElement.classList.add('still');
  const WQ = parseInt(q.get('w')), HQ = parseInt(q.get('h'));
  if (WQ && HQ){ stage.style.width = WQ+'px'; stage.style.height = HQ+'px'; }
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 3);
    W = (WQ || cv.clientWidth)  || (STILL ? 390 : innerWidth);
    H = (HQ || cv.clientHeight) || (STILL ? 844 : innerHeight);
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  // ---- 時間 ----
  const pctEl = document.getElementById('pct');
  const fillEl = document.getElementById('fill'), cellEl = document.getElementById('cell');
  const clockEl = document.getElementById('clock'), secEl = document.getElementById('sec');
  const dateEl = document.getElementById('date'), greetEl = document.getElementById('greet');
  const wxEl = document.getElementById('wx'), agEl = document.getElementById('agenda');
  const agEvents = document.getElementById('ag-events'), agTodos = document.getElementById('ag-todos');
  const agSep = document.getElementById('ag-sep'), agCount = document.getElementById('ag-count');
  const DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'], MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  // ---- 電量（有動畫）----
  let level = 69;
  function setBattery(v, charging){
    v = Math.max(0, Math.min(100, Math.round(v)));
    level = v;
    pctEl.textContent = v + '%';
    fillEl.style.width = Math.max(4, v * (100 - 5) / 100) + '%';
    fillEl.classList.toggle('low', v <= 20);
    cellEl.classList.toggle('charging', !!charging);
  }

  // ---- 行事曆 / 待辦 ----
  function esc(t){ return String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

  function renderAgenda(d){
    const ev = (d.events || []).slice(0, 3);
    const td = (d.todos || []).slice(0, 3);
    if (!ev.length && !td.length){ agEl.classList.remove('show'); return; }
    agEvents.innerHTML = ev.map(e =>
      `<div class="ag-row"><span class="ag-t">${e.allDay ? '全天' : esc(e.t)}</span><span class="ag-x">${esc(e.title)}</span></div>`
    ).join('');
    agSep.style.display = (ev.length && td.length) ? 'block' : 'none';
    agTodos.innerHTML = td.map(t =>
      `<div class="ag-row"><span class="ag-dot"></span><span class="ag-x">${esc(t.title)}</span></div>`
    ).join('');
    const more = [];
    if ((d.counts?.events || 0) > ev.length) more.push('還有 ' + (d.counts.events - ev.length) + ' 個行程');
    if ((d.counts?.todos || 0) > td.length) more.push('待辦 ' + d.counts.todos + ' 件');
    agCount.textContent = more.join(' · ');
    agEl.dataset.has = '1';
    if (L.agenda) { agEl.classList.add('show'); } else { agEl.classList.remove('show'); }
  }

  // ---- 天氣 ----
  function renderWeather(w, city){
    if (!w) return;
    const t = (w.temp === undefined || w.temp === null) ? '--' : Math.round(w.temp);
    const d = w.desc || '';
    wxEl.innerHTML = `${t}°&nbsp;&nbsp;${esc(d)}`;
    if (city) document.getElementById('city').textContent = city;
  }

  // ---- 音樂 ----
  const nowpEl = document.getElementById('nowp');
  function renderMusic(m){
    if (!m || !m.title){ nowpEl.classList.remove('show'); return; }
    const eq = '<span class="eq"><span></span><span></span><span></span></span>';
    nowpEl.innerHTML = eq + esc(m.title) + (m.artist ? ' — ' + esc(m.artist) : '');
    nowpEl.classList.toggle('paused', !m.playing);
    nowpEl.classList.add('show');
  }

  // ---- 原生橋接（iOS App 會呼叫這個）----
  let nativeSeen = false;
  window.applyNative = function(d){
    nativeSeen = true;
    if (typeof d.battery === 'number') setBattery(d.battery * 100, d.charging);
    if (d.weather) renderWeather(d.weather, d.city);
    else if (d.city) document.getElementById('city').textContent = d.city;
    renderAgenda(d);
    if (d.music) renderMusic(d.music);
  };

  function tick(){
    const d = new Date();
    clockEl.firstChild.nodeValue = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    secEl.textContent = String(d.getSeconds()).padStart(2,'0');
    dateEl.textContent = DOW[d.getDay()] + ' · ' + d.getDate() + ' ' + MON[d.getMonth()];
    const h = d.getHours();
    greetEl.innerHTML = (h < 12 ? 'Good<br>Morning' : h < 18 ? 'Good<br>Afternoon' : 'Good<br>Evening');
  }

  resize(); tick(); setBattery(level);
  addEventListener('resize', () => { resize(); if (FREEZE===null) draw(phase()); else draw(FREEZE); });
  setInterval(tick, 1000);

  const PERIOD = 14000; // 風車一圈 14 秒
  function phase(){ return (performance.now() % PERIOD) / PERIOD; }

  function loop(){
    draw(FREEZE===null ? phase() : FREEZE);
    requestAnimationFrame(loop);
  }
  loop();


  // ================= 排版：尺寸預設 + 元件開關 + 拖曳 =================
  const LKEY = 'shanyang.layout.v1';
  const PRESET = {
    S: {size:'S', city:0, greet:0, wx:1, agenda:0, music:0, sec:0, battery:1, clockPos:'left', clockScale:1.26},
    M: {size:'M', city:1, greet:1, wx:1, agenda:0, music:1, sec:1, battery:1, clockPos:'left', clockScale:1},
    L: {size:'L', city:1, greet:1, wx:1, agenda:1, music:1, sec:1, battery:1, clockPos:'left', clockScale:0.92}
  };
  const TOGGLES = [
    ['city','城市'], ['greet','問候'], ['wx','天氣'], ['agenda','行事曆/待辦'],
    ['music','音樂'], ['battery','電量'], ['sec','秒數']
  ];
  let L = Object.assign({}, PRESET.L, { pos:{} });
  try { const raw = localStorage.getItem(LKEY); if (raw) L = Object.assign(L, JSON.parse(raw)); } catch(e){}
  if (!PRESET[L.size]) L = Object.assign({}, PRESET.L, { pos: {} });

  const stageEl = document.getElementById('stage');
  const elMap = {
    city: document.getElementById('city'),
    greet: document.getElementById('greet'),
    wx: document.getElementById('wx'),
    agenda: document.getElementById('agenda'),
    music: document.getElementById('nowp'),
    battery: document.querySelector('.bat'),
    sec: document.getElementById('sec'),
    brand: document.querySelector('.brand'),
    clock: document.getElementById('clock'),
    date: document.getElementById('date')
  };

  function save(){ try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e){} }

  function applyLayout(){
    document.body.dataset.size = L.size;
    elMap.city.style.display = L.city ? '' : 'none';
    elMap.greet.style.display = L.greet ? '' : 'none';
    elMap.wx.style.display = L.wx ? '' : 'none';
    elMap.wx.style.marginTop = L.greet ? '' : '0';
    document.querySelector('.right').style.display = (L.greet || L.wx) ? '' : 'none';
    elMap.music.style.display = L.music ? '' : 'none';
    elMap.battery.style.display = L.battery ? '' : 'none';
    elMap.sec.style.display = L.sec ? '' : 'none';
    if (!L.agenda) agEl.classList.remove('show');
    else if (agEl.dataset.has === '1') agEl.classList.add('show');

    const clock = elMap.clock, date = elMap.date;
    const base = 'clamp(46px,16.5vw,78px)';
    clock.style.fontSize = `calc(${base} * ${L.clockScale})`;
    const isRight = L.clockPos === 'right';
    clock.style.left = isRight ? 'auto' : '24px';
    clock.style.right = isRight ? '24px' : 'auto';
    clock.style.textAlign = isRight ? 'right' : 'left';
    date.style.left = isRight ? 'auto' : '26px';
    date.style.right = isRight ? '26px' : 'auto';
    date.style.textAlign = isRight ? 'right' : 'left';

    // 自訂拖曳位置
    for (const key in L.pos){
      const el = document.querySelector('[data-k="' + key + '"]') || elMap[key];
      if (!el) continue;
      const p = L.pos[key];
      el.style.left = p.l + '%'; el.style.top = p.t + '%';
      el.style.right = 'auto'; el.style.bottom = 'auto';
    }
    syncSheet();
  }

  // ---- 編輯面板 ----
  const sheet = document.getElementById('sheet');
  const togglesEl = document.getElementById('toggles');
  let editing = false;

  togglesEl.innerHTML = TOGGLES.map(([k,n]) =>
    `<div class="sh-btn" data-t="${k}">${n}</div>`).join('');

  function syncSheet(){
    [...togglesEl.children].forEach(b => b.classList.toggle('on', !!L[b.dataset.t]));
    document.querySelectorAll('[data-clock]').forEach(b => b.classList.toggle('on', L.clockPos === b.dataset.clock));
    document.querySelectorAll('[data-size]').forEach(b => b.classList.toggle('on', Math.abs(parseFloat(b.dataset.size) - L.clockScale) < 0.01));
    document.querySelectorAll('[data-fam]').forEach(b => b.classList.toggle('on', L.size === b.dataset.fam));
  }

  togglesEl.addEventListener('click', e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    L[b.dataset.t] = L[b.dataset.t] ? 0 : 1;
    if (b.dataset.t === 'agenda') agEl.dataset.has === '1' && agEl.classList.toggle('show', !!L.agenda);
    save(); applyLayout();
  });
  document.querySelectorAll('[data-clock]').forEach(b => b.onclick = () => {
    L.clockPos = b.dataset.clock; L.pos.clock = null; delete L.pos.clock; L.pos.date = null; delete L.pos.date;
    save(); applyLayout(); resetPos('clock'); resetPos('date');
  });
  document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
    L.clockScale = parseFloat(b.dataset.size); save(); applyLayout();
  });
  document.querySelectorAll('[data-fam]').forEach(b => b.onclick = () => {
    L = Object.assign({}, PRESET[b.dataset.fam], { pos: {} });
    document.querySelectorAll('[data-k]').forEach(el => { el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; });
    save(); applyLayout();
  });
  document.getElementById('reset').onclick = () => {
    L = Object.assign({}, PRESET.L, { pos: {} });
    document.querySelectorAll('[data-k]').forEach(el => { el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; });
    save(); applyLayout();
  };
  function resetPos(key){
    const el = document.querySelector('[data-k="' + key + '"]');
    if (el) { el.style.left=''; el.style.top=''; el.style.right=''; el.style.bottom=''; }
    delete L.pos[key]; save();
  }

  function openSheet(){ editing = true; document.body.classList.add('editing'); sheet.classList.add('open'); }
  function closeSheet(){ editing = false; document.body.classList.remove('editing'); sheet.classList.remove('open'); }
  document.getElementById('done').onclick = closeSheet;

  // 長按進入編輯
  let pressTimer = null;
  const bootAt = performance.now();
  document.getElementById('gear').addEventListener('click', e => { e.stopPropagation(); openSheet(); });
  stageEl.addEventListener('pointerdown', e => {
    if (editing || e.target.closest('.sheet')) return;
    if (performance.now() - bootAt < 1500) return;
    pressTimer = setTimeout(() => { openSheet(); if (navigator.vibrate) navigator.vibrate(8); }, 520);
  }, {passive:true});
  ['pointerup','pointercancel','pointermove'].forEach(t =>
    stageEl.addEventListener(t, () => clearTimeout(pressTimer), {passive:true}));

  // 拖曳
  ['brand','city','battery','clock','date','greet','agenda','music'].forEach(k => {
    const el = elMap[k]; if (!el) return;
    el.setAttribute('data-k', k);
    el.style.touchAction = 'none';
    let sx=0, sy=0, ox=0, oy=0, dragging=false;
    el.addEventListener('pointerdown', e => {
      if (!editing) return;
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      const r = el.getBoundingClientRect(), sr = stageEl.getBoundingClientRect();
      ox = r.left - sr.left; oy = r.top - sr.top;
      sx = e.clientX; sy = e.clientY; dragging = true;
      el.style.right='auto'; el.style.bottom='auto'; el.style.left = ox+'px'; el.style.top = oy+'px';
    });
    el.addEventListener('pointermove', e => {
      if (!dragging) return;
      const sr = stageEl.getBoundingClientRect();
      const nx = Math.max(-20, Math.min(sr.width - 40, ox + e.clientX - sx));
      const ny = Math.max(0, Math.min(sr.height - 30, oy + e.clientY - sy));
      el.style.left = nx+'px'; el.style.top = ny+'px';
    });
    el.addEventListener('pointerup', e => {
      if (!dragging) return; dragging = false;
      const sr = stageEl.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      L.pos[k] = { l: +(((r.left - sr.left) / sr.width) * 100).toFixed(2),
                   t: +(((r.top - sr.top) / sr.height) * 100).toFixed(2) };
      save();
    });
  });

  if (q.has('fam') && PRESET[q.get('fam')]) L = Object.assign({}, PRESET[q.get('fam')], {pos:{}});
  applyLayout();
  if (q.has('edit')) setTimeout(openSheet, 120);
  if (!localStorage.getItem(LKEY)){
    const hint = document.getElementById('hint');
    setTimeout(() => hint.classList.add('show'), 900);
    setTimeout(() => hint.classList.remove('show'), 5200);
  }

  // 1.5 秒內沒收到原生資料 → 顯示示範值（網頁版用）
  setTimeout(() => {
    if (nativeSeen) return;
    setBattery(66 + 3.4 * (0.5 + 0.5 * Math.sin(2 * Math.PI * phase())), false);
    if (q.has('demo')){
      renderAgenda({ events:[{t:'14:30',title:'與客戶會議'},{t:'16:00',title:'整理報價單'}],
                     todos:[{title:'寄樣品'},{title:'回覆信件'}], counts:{events:3,todos:5} });
      renderWeather({temp:24, desc:'多雲'}, '臺北市');
    }
  }, 1500);

  // 離線快取
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
